services:
  orders-api:
    build: .
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - DB_USER=labuser
      - DB_PASSWORD=labpassword
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=labdb
    depends_on:
      - db
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3000/health && wget -q --spider http://localhost:3000/ready"]
      interval: 10s
      timeout: 3s
      start_period: 20s
      retries: 3

  db:
    image: postgres:16
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=labuser
      - POSTGRES_PASSWORD=labpassword
      - POSTGRES_DB=labdb
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
